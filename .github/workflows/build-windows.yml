name: Build F1 Classic Launcher (Native Windows Desktop)

on:
  workflow_dispatch:
  push:
    branches: [ "fix/windows-build-setup" ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Build native desktop launcher and Swofty components
        shell: pwsh
        run: ./build_windows/build_swofty_and_launcher.ps1

      - name: Verify portable release
        shell: pwsh
        run: |
          $ReleaseDir = "dist/F1ClassicLauncher_Full"
          if (!(Test-Path "$ReleaseDir/F1ClassicLauncher.exe")) { throw "F1ClassicLauncher.exe missing." }
          if (!(Test-Path "$ReleaseDir/swofty_core/swofty.exe")) { throw "Swofty executable missing." }
          if (!(Test-Path "$ReleaseDir/swofty_core/native/dist")) { throw "Swofty native output missing." }

      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path dist/F1ClassicLauncher_Full/* -DestinationPath F1ClassicLauncher_Windows_Full.zip -Force

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: F1ClassicLauncher_Windows_Full
          path: F1ClassicLauncher_Windows_Full.zip
          if-no-files-found: error
          retention-days: 14
