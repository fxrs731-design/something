<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F1 Classic Launcher</title>
  <style>
    :root {
      --bg: #080a0f; --panel: #0e121b; --card: #141926; --card-hover: #192030;
      --border: #232b3e; --text: #eef2f9; --muted: #8b95ad;
      --red: #e10600; --red-hover: #ff2b24; --green: #10b981; --amber: #f59e0b;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Inter, system-ui, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; }
    aside { width: 256px; background: var(--panel); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; gap: 14px; shrink: 0; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 12px; border-bottom: 1px solid var(--border); }
    .brand-badge { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, var(--red-hover), #a80400); display: grid; place-items: center; font-weight: 900; font-size: 13px; color: #fff; }
    nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; text-align: left; transition: all .15s; }
    .nav-btn:hover { background: rgba(255,255,255,0.04); color: var(--text); }
    .nav-btn.active { background: rgba(225,6,0,0.14); border-color: rgba(225,6,0,0.4); color: #fff; }
    main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    header { padding: 16px 24px; border-bottom: 1px solid var(--border); background: rgba(14,18,27,0.7); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    header h1 { margin: 0; font-size: 18px; font-weight: 800; }
    .content { padding: 22px 24px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .btn { border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; background: #1c2335; color: var(--text); transition: .15s; }
    .btn:hover { background: #263047; }
    .btn.primary { background: var(--red); border-color: var(--red); color: #fff; font-weight: 700; }
    .btn.primary:hover { background: var(--red-hover); }
    .btn.green { background: rgba(16,185,129,0.18); border-color: rgba(16,185,129,0.45); color: #6ee7b7; }
    .btn.danger { background: rgba(225,6,0,0.14); border-color: rgba(225,6,0,0.4); color: #fca5a5; }
    input, select { width: 100%; padding: 9px 11px; border-radius: 10px; border: 1px solid var(--border); background: #090b10; color: var(--text); font-size: 13px; }
    label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; margin-bottom: 6px; }
    .season-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, border-color .15s; }
    .season-card:hover { transform: translateY(-2px); border-color: #364363; }
    .cover { height: 140px; background: linear-gradient(135deg, #1b2234, #0d111a); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
    .cover img { width: 100%; height: 100%; object-fit: contain; padding: 6px; background: #0b0e15; }
    .pill { position: absolute; top: 10px; right: 10px; font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 999px; background: rgba(8,10,15,0.85); border: 1px solid var(--border); }
    .pill.installed { background: rgba(16,185,129,0.2); border-color: var(--green); color: #6ee7b7; }
    .dropzone { border: 2px dashed #344160; border-radius: 14px; padding: 28px; text-align: center; background: rgba(20,25,38,0.5); transition: .15s; cursor: pointer; }
    .dropzone.drag { border-color: var(--red); background: rgba(225,6,0,0.08); }
    .toast { position: fixed; bottom: 18px; right: 18px; background: #192030; border: 1px solid var(--border); padding: 11px 16px; border-radius: 10px; font-size: 12px; font-weight: 600; z-index: 99; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .progress-wrap { height: 8px; background: #090b10; border-radius: 999px; overflow: hidden; border: 1px solid var(--border); }
    .progress-bar { height: 100%; background: var(--red); width: 0%; transition: width .2s; }
    @media (max-width: 820px) { body { flex-direction: column; } aside { width: 100%; border-right: 0; border-bottom: 1px solid var(--border); } }
  </style>
</head>
<body>
  <aside>
    <div class="brand">
      <div class="brand-badge">F1</div>
      <div>
        <div style="font-weight:800;font-size:14px;">F1 Classic Launcher</div>
        <div style="font-size:11px;color:var(--muted);">Dynamic Season Manager</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div style="border-top:1px solid var(--border);padding-top:12px;display:flex;flex-direction:column;gap:8px;">
      <label style="margin:0;">Active Game</label>
      <select id="sidebarGameSelect"></select>
      <button id="sidebarLaunchBtn" class="btn primary" style="width:100%;padding:11px;">Launch Selected Game</button>
    </div>
  </aside>

  <main>
    <header>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div id="pageSub" style="font-size:12px;color:var(--muted);margin-top:2px;">Overview of imported seasons, active installs, and game status</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button id="headerImportBtn" class="btn primary">+ Import Season</button>
      </div>
    </header>
    <div id="view" class="content"></div>
  </main>

  <div id="toastRoot"></div>

  <script>
    let state = null;
    let currentTab = 'dashboard';
    let selectedSeasonId = null;
    let filters = { search: '', year: '', game: '', sort: 'season_desc' };

    function toast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.getElementById('toastRoot').appendChild(el);
      setTimeout(() => el.remove(), 3400);
    }

    async function api(url, body) {
      const res = await fetch(url, {
        method: body ? 'POST' : 'GET',
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      return res.json();
    }

    async function refresh() {
      const q = new URLSearchParams(filters).toString();
      state = await api('/api/state?' + q);
      render();
    }

    const tabs = [
      { id: 'dashboard', label: 'Dashboard' },
      { id: 'library', label: 'Season Library' },
      { id: 'import', label: 'Import Package' },
      { id: 'settings', label: 'Settings & Games' },
      { id: 'logs', label: 'Installation Logs' }
    ];

    function renderNav() {
      document.getElementById('nav').innerHTML = tabs.map(t => `
        <button class="nav-btn ${currentTab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>
      `).join('');
      document.querySelectorAll('[data-tab]').forEach(b => {
        b.onclick = () => { currentTab = b.dataset.tab; selectedSeasonId = null; render(); };
      });

      const gsel = document.getElementById('sidebarGameSelect');
      gsel.innerHTML = state.supported_games.map(g => `<option ${state.config.default_game === g ? 'selected' : ''}>${g}</option>`).join('');
      gsel.onchange = async (e) => {
        state.config.default_game = e.target.value;
        await api('/api/settings/save', { default_game: e.target.value });
        refresh();
      };
    }

    document.getElementById('sidebarLaunchBtn').onclick = async () => {
      const game = state.config.default_game;
      const r = await api('/api/game/launch', { game });
      toast(r.ok ? `Launched ${game} (PID ${r.pid})` : r.error);
    };

    document.getElementById('headerImportBtn').onclick = () => {
      currentTab = 'import';
      selectedSeasonId = null;
      render();
    };

    function seasonCardHtml(s) {
      return `
        <div class="season-card">
          <div class="cover">
            ${s.artwork_url ? `<img src="${s.artwork_url}" alt="${s.name}" />` : `<div style="font-size:26px;font-weight:900;color:#2f3a56;">F1 ${s.season}</div>`}
            <span class="pill ${s.installed ? 'installed' : ''}">${s.installed ? 'INSTALLED' : (s.requires_swofty_core ? 'REQUIRES SWOFTY CORE' : s.game)}</span>
          </div>
          <div style="padding:14px;display:flex;flex-direction:column;gap:8px;flex:1;justify-content:space-between;">
            <div>
              <div style="font-weight:800;font-size:15px;">${s.name}</div>
              <div style="font-size:11px;color:var(--muted);margin-top:2px;">${s.season} · v${s.version} · by ${s.author}</div>
              <div style="font-size:12px;color:#cbd5e1;margin-top:8px;line-height:1.4;">${s.description}</div>
            </div>
            <div style="display:flex;gap:8px;padding-top:8px;">
              <button class="btn primary" style="flex:1;" data-open-season="${s.id}">View Details</button>
              ${s.installed
                ? `<button class="btn danger" data-uninstall-season="${s.id}">Uninstall</button>`
                : `<button class="btn green" data-install-season="${s.id}">Install</button>`}
            </div>
          </div>
        </div>
      `;
    }

    function bindSeasonCardActions(root) {
      root.querySelectorAll('[data-open-season]').forEach(b => {
        b.onclick = () => { selectedSeasonId = b.dataset.openSeason; render(); };
      });
      root.querySelectorAll('[data-install-season]').forEach(b => {
        b.onclick = async () => {
          toast('Installing season...');
          const r = await api('/api/season/install', { season_id: b.dataset.installSeason });
          toast(r.ok ? `Installed (${r.files_modified} files)` : r.error);
          refresh();
        };
      });
      root.querySelectorAll('[data-uninstall-season]').forEach(b => {
        b.onclick = async () => {
          const r = await api('/api/season/uninstall', { season_id: b.dataset.uninstallSeason });
          toast(r.ok ? `Restored ${r.restored} original files` : r.error);
          refresh();
        };
      });
    }

    function renderDashboard(view) {
      const seasons = state.seasons;
      const installed = seasons.filter(s => s.installed);
      const featured = installed[0] || seasons[0];
      const defGame = state.config.default_game;
      const defPath = (state.config.game_paths || {})[defGame] || 'Not configured';

      view.innerHTML = `
        <div class="grid-2">
          <div class="card" style="background:linear-gradient(135deg,#181e2e,#111520);border-color:#2e3852;">
            <label>Featured Season</label>
            ${featured ? `
              <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;">
                <div>
                  <div style="font-size:20px;font-weight:800;">${featured.name}</div>
                  <div style="font-size:12px;color:var(--muted);margin-top:4px;">Target: ${featured.game} · Author: ${featured.author} · v${featured.version}</div>
                  <p style="font-size:13px;color:#cbd5e1;margin:10px 0 14px;">${featured.description}</p>
                  <div style="display:flex;gap:8px;">
                    <button class="btn primary" data-open-season="${featured.id}">Open Season Page</button>
                    ${featured.installed ? `<button class="btn green" id="dashPlayBtn">Play ${featured.game}</button>` : `<button class="btn green" data-install-season="${featured.id}">Install Season</button>`}
                  </div>
                </div>
              </div>
            ` : `
              <div style="font-size:14px;font-weight:700;margin-top:6px;">No seasons imported yet</div>
              <p style="font-size:12px;color:var(--muted);">Import a season ZIP or folder (including the included F1 2018 example package) to get started.</p>
              <button class="btn primary" onclick="currentTab='import';render();">Import First Season</button>
            `}
          </div>

          <div class="card">
            <label>Selected Game &amp; Installation Status</label>
            <div style="font-size:17px;font-weight:800;margin-bottom:4px;">${defGame}</div>
            <div style="font-size:12px;font-family:monospace;color:var(--muted);word-break:break-all;margin-bottom:12px;">${defPath}</div>
            <div style="display:flex;gap:12px;margin-bottom:14px;font-size:12px;">
              <div><strong>${seasons.length}</strong> Imported Seasons</div>
              <div><strong>${installed.length}</strong> Active Installs</div>
            </div>
            <div class="progress-wrap"><div class="progress-bar" style="width:${state.progress.percent || 0}%"></div></div>
            <div style="font-size:11px;color:var(--muted);margin-top:6px;">Status: ${state.progress.message}</div>
          </div>
        </div>

        <div>
          <h2 style="font-size:15px;margin:0 0 12px;">Installed &amp; Recently Added Seasons</h2>
          ${seasons.length ? `<div class="grid-3">${seasons.slice(0, 6).map(seasonCardHtml).join('')}</div>` : `<div class="card" style="font-size:13px;color:var(--muted);">Your season library is empty. Use <strong>Import Package</strong> to add any custom season.</div>`}
        </div>
      `;

      bindSeasonCardActions(view);
      const playBtn = document.getElementById('dashPlayBtn');
      if (playBtn) {
        playBtn.onclick = async () => {
          const r = await api('/api/game/launch', { game: featured.game });
          toast(r.ok ? `Launched ${featured.game}` : r.error);
        };
      }
    }

    function renderSeasonDetails(view, s) {
      view.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="btn" id="backToLibBtn">← Back</button>
          <span style="font-size:12px;color:var(--muted);">Season ID: <span style="font-family:monospace;">${s.id}</span></span>
        </div>
        <div class="card" style="display:flex;gap:20px;flex-wrap:wrap;">
          <div style="width:260px;height:160px;border-radius:12px;overflow:hidden;background:#090b10;flex-shrink:0;display:grid;place-items:center;">
            ${s.artwork_url ? `<img src="${s.artwork_url}" style="width:100%;height:100%;object-fit:cover;" />` : `<div style="font-size:28px;font-weight:900;color:#2f3a56;">F1 ${s.season}</div>`}
          </div>
          <div style="flex:1;min-width:240px;">
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
              <h2 style="margin:0;font-size:22px;">${s.name}</h2>
              <span class="pill ${s.installed ? 'installed' : ''}" style="position:static;">${s.installed ? 'INSTALLED' : 'NOT INSTALLED'}</span>
            </div>
            <div style="font-size:12px;color:var(--muted);margin-top:6px;">Year: ${s.season} · Target Game: <strong>${s.game}</strong> · Version: v${s.version} · Author: ${s.author}</div>
            <p style="font-size:13px;color:#cbd5e1;line-height:1.5;margin:12px 0;">${s.description}</p>${s.requires_swofty_core ? `<div style="padding:10px 12px;border-radius:10px;background:rgba(245,158,11,0.12);border:1px solid rgba(245,158,11,0.45);color:#fcd34d;font-size:12px;margin-bottom:12px;">Compatibility Notice: ${s.notes}</div>` : ''}
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${s.installed
                ? `<button class="btn green" id="detPlayBtn">Play ${s.game}</button><button class="btn danger" id="detUninstallBtn">Uninstall &amp; Restore</button>`
                : `<button class="btn primary" id="detInstallBtn">Install Season</button>`}
              <button class="btn" id="detOpenDirBtn">Open Package Folder</button>
              <button class="btn danger" id="detRemoveBtn">Remove Package</button>
            </div>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h3 style="margin:0 0 10px;font-size:14px;">Teams (${s.teams.length}) &amp; Drivers (${s.drivers.length})</h3>
            <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Teams: ${s.teams.length ? s.teams.map(t => typeof t === 'string' ? t : t.name).join(', ') : 'None listed in manifest'}</div>
            <div style="font-size:12px;color:var(--muted);">Drivers: ${s.drivers.length ? s.drivers.map(d => typeof d === 'string' ? d : d.name).join(', ') : 'None listed in manifest'}</div>
          </div>
          <div class="card">
            <h3 style="margin:0 0 10px;font-size:14px;">Mod Operations (${s.operations.length}) &amp; Dependencies</h3>
            <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Adapter: <code>${s.adapter}</code> · Dependencies: ${s.dependencies.length ? s.dependencies.join(', ') : 'None'}</div>
            <div style="font-size:11px;font-family:monospace;color:#93c5fd;max-height:120px;overflow:auto;">
              ${s.operations.map(op => `<div>• ${op.type}: ${op.source || ''} → ${op.target || ''}</div>`).join('') || 'No file operations declared.'}
            </div>
          </div>
        </div>
      `;

      document.getElementById('backToLibBtn').onclick = () => { selectedSeasonId = null; render(); };
      const inst = document.getElementById('detInstallBtn');
      if (inst) inst.onclick = async () => { const r = await api('/api/season/install', { season_id: s.id }); toast(r.ok ? `Installed (${r.files_modified} files)` : r.error); refresh(); };
      const uninst = document.getElementById('detUninstallBtn');
      if (uninst) uninst.onclick = async () => { const r = await api('/api/season/uninstall', { season_id: s.id }); toast(r.ok ? `Restored ${r.restored} files` : r.error); refresh(); };
      const play = document.getElementById('detPlayBtn');
      if (play) play.onclick = async () => { const r = await api('/api/game/launch', { game: s.game }); toast(r.ok ? `Launched ${s.game}` : r.error); };
      document.getElementById('detOpenDirBtn').onclick = async () => { await api('/api/open_folder', { path: s.package_dir }); };
      document.getElementById('detRemoveBtn').onclick = async () => {
        const r = await api('/api/season/remove', { season_id: s.id });
        toast(r.ok ? 'Season package removed.' : r.error);
        if (r.ok) selectedSeasonId = null;
        refresh();
      };
    }

    function renderLibrary(view) {
      const years = [...new Set(state.seasons.map(s => s.season))].sort((a,b) => b-a);
      view.innerHTML = `
        <div class="card" style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;">
          <input id="libSearch" type="search" placeholder="Search seasons, authors, games..." value="${filters.search}" />
          <select id="libYear"><option value="">All Years</option>${years.map(y => `<option value="${y}" ${String(filters.year)===String(y)?'selected':''}>${y}</option>`).join('')}</select>
          <select id="libGame"><option value="">All Games</option>${state.supported_games.map(g => `<option ${filters.game===g?'selected':''}>${g}</option>`).join('')}</select>
          <select id="libSort">
            <option value="season_desc" ${filters.sort==='season_desc'?'selected':''}>Year (Newest)</option>
            <option value="season_asc" ${filters.sort==='season_asc'?'selected':''}>Year (Oldest)</option>
            <option value="name_asc" ${filters.sort==='name_asc'?'selected':''}>Name (A–Z)</option>
            <option value="recent" ${filters.sort==='recent'?'selected':''}>Recently Added</option>
          </select>
        </div>
        ${state.invalid_packages.length ? `
          <div class="card" style="border-color:rgba(245,158,11,0.5);">
            <strong style="color:var(--amber);font-size:13px;">Invalid Packages Detected (${state.invalid_packages.length})</strong>
            ${state.invalid_packages.map(inv => `<div style="font-size:12px;margin-top:4px;"><code>${inv.folder}</code>: ${inv.errors.join('; ')}</div>`).join('')}
          </div>
        ` : ''}
        <div class="grid-3">${state.seasons.map(seasonCardHtml).join('') || '<div class="card">No matching seasons found.</div>'}</div>
      `;
      bindSeasonCardActions(view);
      document.getElementById('libSearch').onchange = (e) => { filters.search = e.target.value; refresh(); };
      document.getElementById('libYear').onchange = (e) => { filters.year = e.target.value; refresh(); };
      document.getElementById('libGame').onchange = (e) => { filters.game = e.target.value; refresh(); };
      document.getElementById('libSort').onchange = (e) => { filters.sort = e.target.value; refresh(); };
    }

    function renderImport(view) {
      view.innerHTML = `
        <div class="card">
          <h2>Import Season Package (.zip or Folder)</h2>
          <p style="font-size:12px;color:var(--muted);">Packages must include a valid <code>manifest.json</code>, declared artwork, and modification files. Duplicate season IDs are safely flagged before overwriting.</p>
          <div id="dropzone" class="dropzone" style="margin:14px 0;">
            <div style="font-weight:700;font-size:14px;">Drag &amp; Drop a Season .zip Here</div>
            <div style="font-size:12px;color:var(--muted);margin-top:4px;">or click to select a .zip file from your computer</div>
            <input id="fileInput" type="file" accept=".zip" style="display:none;" />
          </div>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <input id="importPathInput" type="text" placeholder="Or paste a local .zip or folder path..." />
            <button class="btn" id="browseFolderBtn" style="white-space:nowrap;">Browse Folder</button>
            <button class="btn primary" id="importPathBtn" style="white-space:nowrap;">Import Path</button>
          </div>
          <div id="importResult" style="margin-top:12px;font-size:12px;"></div>
        </div>
      `;

      const dz = document.getElementById('dropzone');
      const fi = document.getElementById('fileInput');
      const resBox = document.getElementById('importResult');

      async function handleUpload(file, allowUpdate = false) {
        const reader = new FileReader();
        reader.onload = async () => {
          const b64 = reader.result.split(',')[1];
          const r = await api('/api/import/upload', { filename: file.name, data_base64: b64, allow_update: allowUpdate });
          showImportResponse(r, () => handleUpload(file, true));
        };
        reader.readAsDataURL(file);
      }

      function showImportResponse(r, retryUpdate) {
        if (r.ok) {
          resBox.innerHTML = `<span style="color:var(--green);">Successfully ${r.action} <strong>${r.name}</strong> (${r.game}, ${r.season}).</span>`;
          toast(`Imported ${r.name}`);
          refresh();
        } else if (r.duplicate) {
          resBox.innerHTML = `<span style="color:var(--amber);">${r.errors.join(' ')}</span> <button id="confirmUpdateBtn" class="btn primary" style="margin-left:8px;">Update Existing Package</button>`;
          document.getElementById('confirmUpdateBtn').onclick = retryUpdate;
        } else {
          resBox.innerHTML = `<span style="color:#fca5a5;">Validation failed: ${(r.errors || ['Unknown error']).join(' | ')}</span>`;
        }
      }

      dz.onclick = () => fi.click();
      fi.onchange = () => { if (fi.files[0]) handleUpload(fi.files[0]); };
      dz.ondragover = (e) => { e.preventDefault(); dz.classList.add('drag'); };
      dz.ondragleave = () => dz.classList.remove('drag');
      dz.ondrop = (e) => { e.preventDefault(); dz.classList.remove('drag'); if (e.dataTransfer.files[0]) handleUpload(e.dataTransfer.files[0]); };

      document.getElementById('browseFolderBtn').onclick = async () => {
        const r = await api('/api/browse', { mode: 'dir' });
        if (r.path) document.getElementById('importPathInput').value = r.path;
      };
      document.getElementById('importPathBtn').onclick = async () => {
        const p = document.getElementById('importPathInput').value.trim();
        const r = await api('/api/import/path', { path: p, allow_update: false });
        showImportResponse(r, async () => {
          const r2 = await api('/api/import/path', { path: p, allow_update: true });
          showImportResponse(r2, () => {});
        });
      };
    }

    function renderSettings(view) {
      const paths = state.config.game_paths || {};
      view.innerHTML = `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <h2 style="margin:0;">Game Installation Directories</h2>
            <button class="btn primary" id="autoDetectBtn">Auto-Detect Installed Games</button>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            ${state.supported_games.map(g => `
              <div style="display:grid;grid-template-columns:110px 1fr auto auto;gap:8px;align-items:center;">
                <strong style="font-size:12px;">${g}</strong>
                <input data-game-input="${g}" type="text" value="${(state.config.game_executables || {})[g] || paths[g] || ''}" placeholder="Folder or .exe (e.g. EAAntiCheat.GameServiceLauncher.exe)" />
                <button class="btn" data-browse-exe="${g}">Browse .exe</button>
                <button class="btn" data-save-game="${g}">Validate &amp; Save</button>
              </div>
            `).join('')}
          </div>
        </div>
        <div class="card">
          <h2>Launcher Storage &amp; Info</h2>
          <div class="grid-3">
            <div><label>Seasons Directory</label><input id="setSeasonsDir" value="${state.config.seasons_dir}" /></div>
            <div><label>Backups Directory</label><input id="setBackupsDir" value="${state.config.backups_dir}" /></div>
            <div><label>Imports Directory</label><input id="setImportsDir" value="${state.config.imports_dir}" /></div>
          </div>
          <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:12px;color:var(--muted);">F1 Classic Launcher v${state.config.app_version} · Independent Core (No Swofty Core required)</span>
            <button class="btn green" id="saveDirsBtn">Save Directory Settings</button>
          </div>
        </div>
      `;

      document.getElementById('autoDetectBtn').onclick = async () => {
        const r = await api('/api/game/detect', {});
        toast(`Detected ${Object.keys(r.detected || {}).length} game(s)`);
        refresh();
      };
      view.querySelectorAll('[data-browse-exe]').forEach(b => {
        b.onclick = async () => {
          const g = b.dataset.browseExe;
          const r = await api('/api/browse', { mode: 'exe' });
          if (r.path) {
            view.querySelector(`[data-game-input="${g}"]`).value = r.path;
            const res = await api('/api/game/set_path', { game: g, path: r.path });
            toast(res.ok ? `${g} set to ${res.executable}` : res.reason);
            refresh();
          }
        };
      });
      view.querySelectorAll('[data-save-game]').forEach(b => {
        b.onclick = async () => {
          const g = b.dataset.saveGame;
          const val = view.querySelector(`[data-game-input="${g}"]`).value.trim();
          const r = await api('/api/game/set_path', { game: g, path: val });
          toast(r.ok ? `${g} verified: ${r.executable}` : r.reason);
          refresh();
        };
      });
      document.getElementById('saveDirsBtn').onclick = async () => {
        await api('/api/settings/save', {
          seasons_dir: document.getElementById('setSeasonsDir').value.trim(),
          backups_dir: document.getElementById('setBackupsDir').value.trim(),
          imports_dir: document.getElementById('setImportsDir').value.trim(),
        });
        toast('Settings saved');
        refresh();
      };
    }

    function renderLogs(view) {
      view.innerHTML = `
        <div class="card">
          <h2>Launcher &amp; Installation Logs</h2>
          <div style="font-family:monospace;font-size:12px;background:#090b10;padding:12px;border-radius:10px;max-height:460px;overflow:auto;">
            ${state.logs.map(l => `<div><span style="color:var(--muted);">[${l.timestamp}]</span> <strong>${l.level}</strong>: ${l.message}</div>`).join('')}
          </div>
        </div>
      `;
    }

    function render() {
      renderNav();
      const view = document.getElementById('view');
      if (selectedSeasonId) {
        const s = state.seasons.find(x => x.id === selectedSeasonId);
        if (s) {
          document.getElementById('pageTitle').textContent = s.name;
          renderSeasonDetails(view, s);
          return;
        }
      }
      const titles = { dashboard: 'Dashboard', library: 'Season Library', import: 'Import Package', settings: 'Settings & Games', logs: 'Installation Logs' };
      document.getElementById('pageTitle').textContent = titles[currentTab] || 'Dashboard';
      if (currentTab === 'dashboard') renderDashboard(view);
      else if (currentTab === 'library') renderLibrary(view);
      else if (currentTab === 'import') renderImport(view);
      else if (currentTab === 'settings') renderSettings(view);
      else if (currentTab === 'logs') renderLogs(view);
    }

    refresh();
  </script>
</body>
</html>
